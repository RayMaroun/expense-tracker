<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    #total { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Expenses</h1>
  <label>Month <input id="month" type="month" value="2026-09"></label>
  <table>
    <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th></tr></thead>
    <tbody id="rows"></tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="num" id="total"></td></tr></tfoot>
  </table>
  <script type="importmap">
    { "imports": { "moment": "https://esm.sh/moment@2.30.1", "@expense/shared": "/packages/shared/dist/index.js" } }
  </script>
  <script type="module" src="/packages/web/dist/app.js"></script>
</body>
</html>
